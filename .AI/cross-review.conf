# cross-review reviewer settings — team defaults (tracked).
# Parent: .agents/skills/cross-review/SKILL.md
#
# To change them for yourself only, create .AI/cross-review.local.conf (git-ignored) with just
# the keys you want to override. It is read after this file, and a key there wins. Example for a
# cheaper plan:
#   CLAUDE_MODEL=claude-sonnet-5
#   CLAUDE_EFFORT=medium
#   CODEX_EFFORT=medium
#   MAX_PERSPECTIVES=1
#
# (한국어) 요금제에 맞게 모델/추론강도를 바꾸려면 이 파일은 두고 .AI/cross-review.local.conf 를
# 만들어 바꿀 키만 적으세요. 그 파일은 커밋되지 않습니다.
#
# Format: KEY=VALUE, one per line, no quotes, no spaces. `#` starts a comment. The file is parsed,
# never sourced, and unknown keys or malformed values make cross_review.sh stop.
#
#   CLAUDE_MODEL      model passed to `claude -p --model` (a full id or an alias like `sonnet`)
#   CLAUDE_EFFORT     `claude --effort`: low | medium | high | xhigh | max
#   CODEX_MODEL       model passed to `codex exec -m`
#   CODEX_EFFORT      codex `model_reasoning_effort`: minimal | low | medium | high | xhigh
#   MAX_PERSPECTIVES  cap on perspective prompts per round (empty = no cap). Each perspective
#                     costs one reviewer per family, so 2 perspectives = 4 reviewer runs.
#   REVIEW_POLICY     recommended (the agent offers a review, runs it when you agree) | required
#                     (the agent runs it without asking, wherever .AI/flow.md §2 offers one).
#                     `cross_review.sh --policy` prints the effective value.
#
# Full explanation for teammates (Korean): Docs/AI/ai-workflow.md §3.

CLAUDE_MODEL=claude-opus-5-5
CLAUDE_EFFORT=high
CODEX_MODEL=gpt-6-sol
CODEX_EFFORT=high
MAX_PERSPECTIVES=
REVIEW_POLICY=recommended
